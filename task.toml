schema_version = "1.1"
[provenance]
origin = "original"
source_repo = "https://github.com/neetshah/minesweeper-risk-mt"
source_commit = "92d1328"

[task]
name = "codimango/minesweeper-risk-mt"
description = "Multi-turn minesweeper solver: Step1 builds deterministic safe/flag engine from board JSON, Step2 adds PGM image parsing and exact minimal-risk tile selection, and Step3 adds exact rational risk reports. Graded on held-out generated boards."
authors = [{ name = "Minesweeper Team", email = "team@meta.com" }]
keywords = ["python", "games_and_simulation", "multimedia_and_signal_processing", "multi-turn"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"
[metadata]
author_name = "Minesweeper Team"
author_email = "team@meta.com"
difficulty = "hard"
category = "iterate_on_feature"
category_usecase = "extend_behavior"
category_subdomain = "games_and_simulation"
reward_type = "binary"
languages = ["python"]
tags = ["multi-turn", "context-following", "context-overriding", "python", "games_and_simulation", "multimedia_and_signal_processing", "exact-rational", "csp", "image-parsing"]
[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
[environment.env]
[solution.env]
[[steps]]
name = "1_BUILD_CORE"
dependencies = []
min_reward = 1.0
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 900.0
[[steps]]
name = "2_OVERRIDE_PROB"
dependencies = ["1_BUILD_CORE"]
min_reward = 1.0
inherit_prior_session = true
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 900.0
[[steps]]
name = "3_RISK_REPORT"
dependencies = ["2_OVERRIDE_PROB"]
min_reward = 1.0
inherit_prior_session = true
[steps.verifier]
timeout_sec = 300.0
[steps.agent]
timeout_sec = 900.0
